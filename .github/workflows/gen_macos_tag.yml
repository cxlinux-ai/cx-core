name: macos_tag

permissions:
  contents: read

on:
  push:
    tags:
      - "v*"
      - "20*"

jobs:
  build:
    runs-on: "macos-14"
    
    env:
      CARGO_INCREMENTAL: "0"
      SCCACHE_GHA_ENABLED: "true"
      RUSTC_WRAPPER: "sccache"
      MACOSX_DEPLOYMENT_TARGET: "11.0"

    steps:
      - name: "checkout repo"
        uses: actions/checkout@v4
        with:
          submodules: "recursive"
      - name: "Install Rust"
        uses: dtolnay/rust-toolchain@stable
      - name: "Compile with sccache"
        uses: mozilla-actions/sccache-action@v0.0.9
      - name: "Cache Rust Dependencies"
        uses: actions/cache@v4
        id: cache-cargo-vendor
        with:
          path: |
            vendor
            .cargo/config
          key: "cargo-deps-${{ hashFiles('**/Cargo.lock') }}"
      - name: "Vendor dependencies"
        if: steps.cache-cargo-vendor.outputs.cache-hit != 'true'
        shell: bash
        run: "cargo vendor --locked --versioned-dirs >> .cargo/config"
      - name: "Install System Deps"
        shell: bash
        run: "env CI=yes PATH=$PATH ./get-deps"
      - name: "Build cx-terminal (Release mode)"
        shell: bash
        run: "cargo build -p cx-terminal --release"
      - name: "Build cx-terminal-gui (Release mode)"
        shell: bash
        run: "cargo build -p cx-terminal-gui --release"
      - name: "Build cx-mux-server (Release mode)"
        shell: bash
        run: "cargo build -p wezterm-mux-server --release"
      - name: "Build strip-ansi-escapes (Release mode)"
        shell: bash
        run: "cargo build -p strip-ansi-escapes --release"
      - name: "Install cargo-nextest from Cargo"
        uses: baptiste0928/cargo-install@v3
        with:
          crate: "cargo-nextest"
          cache-key: "macos"
      - name: "Test"
        shell: bash
        run: "cargo nextest run --all --no-fail-fast"
      - name: "Package"
        shell: bash
        run: "bash ci/deploy.sh"
      - name: "Upload artifact"
        uses: actions/upload-artifact@v4
        with:
          name: "macos"
          path: |
            CXTerminal-*.zip
            CXTerminal-*.dmg

  upload:
    runs-on: ubuntu-latest
    needs: build
    if: github.repository == 'cxlinux-ai/cx-core'
    permissions:
      contents: write

    steps:
      - name: "checkout repo"
        uses: actions/checkout@v4
      - name: "Download artifact"
        uses: actions/download-artifact@v8
        with:
          name: "macos"
      - name: "Checksum"
        shell: bash
        run: "for f in CXTerminal-*.zip CXTerminal-*.dmg ; do sha256sum $f > $f.sha256 ; done"
      - name: "Create pre-release"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: "bash ci/retry.sh bash ci/create-release.sh $(ci/tag-name.sh)"
      - name: "Upload to Tagged Release"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: "bash ci/retry.sh gh release upload --clobber $(ci/tag-name.sh) CXTerminal-*.zip CXTerminal-*.dmg *.sha256"
